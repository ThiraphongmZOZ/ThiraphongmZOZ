<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ThiraphongmZOZ animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#12060a"/>
      <stop offset="1" stop-color="#2a0509"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3101c" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#6a0a12" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a0509" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4040"/>
      <stop offset="0.55" stop-color="#d11420"/>
      <stop offset="1" stop-color="#5a0008"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2a1114"/>
      <stop offset="1" stop-color="#0b0507"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="eyeShape">
      <path d="M-170,0 Q0,-125 170,0 Q0,125 -170,0 Z"/>
    </clipPath>

    <!-- crow silhouette, faces right -->
    <g id="crow">
      <path d="M-4,-3 C-14,6 -4,18 14,26 C10,14 8,4 8,-3 Z" fill="#0a0709" stroke="#5a0d16" stroke-width="0.8" opacity="0.7">
        <animate attributeName="d" dur="0.8s" repeatCount="indefinite" begin="-0.2s"
          values="M-4,-3 C-14,6 -4,18 14,26 C10,14 8,4 8,-3 Z;M-4,-3 C-12,-22 -2,-32 16,-38 C10,-24 8,-12 8,-3 Z;M-4,-3 C-14,6 -4,18 14,26 C10,14 8,4 8,-3 Z"/>
      </path>
      <path d="M-18,0 L-36,-5 L-33,2 L-36,7 Z" fill="#0a0709" stroke="#5a0d16" stroke-width="0.8"/>
      <path d="M-18,0 C-10,-8 10,-8 20,-3 L32,0 L20,3 C10,8 -10,8 -18,0 Z" fill="#0a0709" stroke="#7a1019" stroke-width="0.8"/>
      <circle cx="19" cy="-1.5" r="1.3" fill="#ff3b3b"/>
      <path d="M-4,-3 C-12,-22 -2,-32 16,-38 C10,-24 8,-12 8,-3 Z" fill="#0a0709" stroke="#7a1019" stroke-width="0.8">
        <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
          values="M-4,-3 C-12,-22 -2,-32 16,-38 C10,-24 8,-12 8,-3 Z;M-4,-3 C-14,6 -4,18 14,26 C10,14 8,4 8,-3 Z;M-4,-3 C-12,-22 -2,-32 16,-38 C10,-24 8,-12 8,-3 Z"/>
      </path>
    </g>

    <path id="feather" d="M0,0 C5,-7 5,-16 0,-24 C-5,-16 -5,-7 0,0 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- pulsing crimson moon -->
  <circle cx="900" cy="200" r="230" fill="url(#moon)">
    <animate attributeName="r" values="215;245;215" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- drifting clouds -->
  <g filter="url(#soft)" fill="#000" opacity="0.7">
    <ellipse cx="300" cy="70" rx="200" ry="26">
      <animateTransform attributeName="transform" type="translate" values="-80,0;120,0;-80,0" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="345" rx="260" ry="30">
      <animateTransform attributeName="transform" type="translate" values="100,0;-140,0;100,0" dur="32s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- subtle scanlines -->
  <g opacity="0.07" stroke="#ff4040" stroke-width="1">
    <path d="M0,50H1200M0,100H1200M0,150H1200M0,200H1200M0,250H1200M0,300H1200M0,350H1200"/>
  </g>

  <!-- the eye -->
  <g transform="translate(900,200)">
    <animateTransform attributeName="transform" type="translate" values="900,200;900,194;900,200" dur="5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.06;1 1;1 1"
        keyTimes="0;0.88;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
      <!-- outer glow -->
      <path d="M-170,0 Q0,-125 170,0 Q0,125 -170,0 Z" fill="none" stroke="#ff2a2a" stroke-width="3" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </path>
      <g clip-path="url(#eyeShape)">
        <rect x="-180" y="-130" width="360" height="260" fill="url(#sclera)"/>
        <circle r="92" fill="url(#iris)"/>
        <!-- rotating rings and emblem -->
        <g fill="none" stroke-linecap="round">
          <circle r="82" stroke="#ff6a6a" stroke-width="2" stroke-dasharray="4 10">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
          </circle>
          <circle r="64" stroke="#ffb3b3" stroke-width="1.5" stroke-dasharray="34 10">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
          </circle>
          <g stroke="#ffd0d0" stroke-width="1.6" opacity="0.9">
            <rect x="-38" y="-38" width="76" height="76"/>
            <rect x="-38" y="-38" width="76" height="76" transform="rotate(45)"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
          </g>
        </g>
        <!-- pupil -->
        <ellipse rx="9" ry="46" fill="#060203">
          <animate attributeName="rx" values="9;14;9" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="-26" cy="-30" r="6" fill="#fff" opacity="0.35"/>
      </g>
    </g>
  </g>

  <!-- flying crows (left to right) -->
  <g>
    <animateMotion dur="15s" repeatCount="indefinite" begin="-2s" path="M-100,95 C250,40 650,150 1300,70"/>
    <g transform="scale(1.4)"><use href="#crow"/></g>
  </g>
  <g>
    <animateMotion dur="19s" repeatCount="indefinite" begin="-9s" path="M-100,330 C300,290 700,380 1300,300"/>
    <g transform="scale(1.1)"><use href="#crow"/></g>
  </g>
  <g>
    <animateMotion dur="12s" repeatCount="indefinite" begin="-5s" path="M-100,230 C400,260 800,170 1300,215"/>
    <g transform="scale(0.8)"><use href="#crow"/></g>
  </g>
  <!-- flying crows (right to left) -->
  <g>
    <animateMotion dur="17s" repeatCount="indefinite" begin="-4s" path="M1300,60 C900,120 400,30 -100,110"/>
    <g transform="scale(-1.2,1.2)"><use href="#crow"/></g>
  </g>
  <g>
    <animateMotion dur="21s" repeatCount="indefinite" begin="-13s" path="M1300,350 C850,310 450,370 -100,320"/>
    <g transform="scale(-0.9,0.9)"><use href="#crow"/></g>
  </g>

  <!-- falling feathers -->
  <g fill="#14070a" stroke="#8a1520" stroke-width="0.8">
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" begin="-1s" path="M180,-30 C240,100 120,250 200,440"/>
      <use href="#feather"><animateTransform attributeName="transform" type="rotate" values="-30;40;-30" dur="3s" repeatCount="indefinite"/></use>
    </g>
    <g>
      <animateMotion dur="12s" repeatCount="indefinite" begin="-6s" path="M520,-30 C470,120 600,260 540,440"/>
      <use href="#feather"><animateTransform attributeName="transform" type="rotate" values="30;-40;30" dur="4s" repeatCount="indefinite"/></use>
    </g>
    <g>
      <animateMotion dur="10s" repeatCount="indefinite" begin="-3s" path="M1040,-30 C1100,110 980,260 1060,440"/>
      <use href="#feather"><animateTransform attributeName="transform" type="rotate" values="-20;50;-20" dur="3.5s" repeatCount="indefinite"/></use>
    </g>
  </g>

  <!-- text -->
  <g font-family="'Courier New', Courier, monospace">
    <text x="60" y="70" font-size="14" letter-spacing="4" fill="#ff5a5a" opacity="0.8">// CRIMSON.SYS ONLINE</text>
    <text x="60" y="190" font-size="58" font-weight="bold" letter-spacing="3" fill="#f5e9e9" filter="url(#glow)">ThiraphongmZOZ</text>
    <text x="62" y="240" font-size="20" letter-spacing="7" fill="#ff4a4a">PYTHON · WEB · TTS</text>
    <rect x="62" y="262" width="14" height="4" fill="#ff4a4a">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- vignette and frame -->
  <rect width="1200" height="400" fill="url(#vignette)"/>
  <rect x="6" y="6" width="1188" height="388" fill="none" stroke="#7a1019" stroke-width="1.5" opacity="0.7"/>
</svg>
